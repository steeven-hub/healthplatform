{% extends "base.html" %}

{% block content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-lg border border-gray-100">
    <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-gray-900">Inscription</h2>
        <p class="text-gray-500 mt-2">Rejoignez le réseau AfriHealth</p>
    </div>

    {% if messages %}
    <div class="mb-6 p-3 bg-blue-50 border-l-4 border-blue-500 rounded">
        {% for message in messages %}
            <p class="text-blue-700 text-sm font-medium">{{ message }}</p>
        {% endfor %}
    </div>
    {% endif %}

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase">Prénom</label>
                <input type="text" name="first_name" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase">Nom</label>
                <input type="text" name="last_name" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-500 uppercase">Nom d'utilisateur *</label>
            <input type="text" name="username" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-500 uppercase">Email *</label>
            <input type="email" name="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase">Mot de passe *</label>
                <input type="password" name="password1" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase">Téléphone</label>
                <input type="text" name="telephone" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
        </div>

        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
            <label class="block text-sm font-bold text-gray-700 mb-2">Vous êtes ?</label>
            <select name="role" id="roleSelect" onchange="toggleDoctorFields()" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white outline-none">
                <option value="patient">Un Patient</option>
                <option value="doctor">Un Médecin / Spécialiste</option>
            </select>
        </div>

        <div id="doctorFields" style="display:none;" class="space-y-4 p-4 bg-green-50 rounded-lg border border-green-200">
            <h4 class="text-green-800 font-bold text-sm">Informations professionnelles</h4>
            <input type="text" name="specialty" placeholder="Spécialité (ex: Cardiologie)" class="w-full px-4 py-2 border border-green-300 rounded-lg outline-none">
            <input type="text" name="license_number" placeholder="Numéro de licence médicale" class="w-full px-4 py-2 border border-green-300 rounded-lg outline-none">
            <input type="number" name="experience" placeholder="Années d'expérience" class="w-full px-4 py-2 border border-green-300 rounded-lg outline-none">
        </div>

        <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 shadow-lg transition">
            Créer mon compte
        </button>
    </form>
</div>

<script>
function toggleDoctorFields() {
    var role = document.getElementById('roleSelect').value;
    var fields = document.getElementById('doctorFields');
    fields.style.display = (role === 'doctor') ? 'block' : 'none';
}
</script>
{% endblock %}
