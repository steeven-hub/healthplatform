{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-lg border border-gray-100 mt-6">
    <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-gray-900">Prendre Rendez-vous</h2>
        <p class="text-gray-500 mt-2">Planifiez votre consultation en quelques clics.</p>
    </div>

    {% if messages %}
    <div class="mb-6">
        {% for message in messages %}
            <p class="p-3 bg-blue-50 text-blue-700 rounded-lg text-sm border-l-4 border-blue-500">{{ message }}</p>
        {% endfor %}
    </div>
    {% endif %}

    <form method="POST" class="space-y-6">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2 uppercase">Choisir un Médecin</label>
            <select name="doctor" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                <option value="">-- Sélectionnez un spécialiste --</option>
                {% for doctor in doctors %}
                    <option value="{{ doctor.id }}">Dr. {{ doctor.user.last_name }} ({{ doctor.specialty }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2 uppercase">Date du rendez-vous</label>
                <input type="date" name="appointment_date" required 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2 uppercase">Heure</label>
                <input type="time" name="appointment_time" required 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2 uppercase">Motif de consultation</label>
            <textarea name="reason" rows="3" placeholder="Décrivez brièvement vos symptômes..." 
                      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
        </div>

        <div class="pt-4">
            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-lg font-bold text-lg hover:bg-blue-700 shadow-md transform hover:scale-[1.01] transition duration-200">
                Confirmer le rendez-vous
            </button>
        </div>
    </form>
</div>
{% endblock %}
