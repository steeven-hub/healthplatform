<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfriHealth - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<nav class="bg-blue-600 text-white p-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
        <div class="font-bold text-xl tracking-wider">AfriHealth</div>
        <div class="flex items-center space-x-6">
            {% if user.is_authenticated %}
                <span class="text-sm border-r border-blue-400 pr-4">Bienvenue, <strong>{{ user.username }}</strong></span>
                <a href="{% url 'logout' %}" class="bg-red-500 hover:bg-red-600 px-4 py-1.5 rounded-lg text-sm font-medium transition">
                    Déconnexion
                </a>
            {% else %}
                <a href="{% url 'login_page' %}" class="hover:text-blue-200 transition">Connexion</a>
                <a href="{% url 'register_page' %}" class="bg-white text-blue-600 px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-blue-50 transition">
                    S'inscrire
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mx-auto p-6">
    {% block content %}{% endblock %}
</div>

<footer class="text-center py-10 text-gray-500 text-xs">
    &copy; 2026 AfriHealth - Système de gestion de santé intelligent.
</footer>

</body>
</html>
