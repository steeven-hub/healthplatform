{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-xl shadow-lg border border-gray-100">
    <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-gray-900">Connexion</h2>
        <p class="text-gray-500 mt-2">Accédez à votre espace santé</p>
    </div>

    {% if messages %}
    <div class="mb-6 p-3 bg-red-50 border-l-4 border-red-500 rounded">
        {% for message in messages %}
            <p class="text-red-700 text-sm font-medium">{{ message }}</p>
        {% endfor %}
    </div>
    {% endif %}

    <form method="POST" class="space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Nom d'utilisateur</label>
            <input type="text" name="username" required 
                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition outline-none"
                   placeholder="ex: wilson_sogbossi">
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Mot de passe</label>
            <input type="password" name="password" required 
                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition outline-none"
                   placeholder="••••••••">
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transform hover:scale-[1.01] transition duration-200 shadow-md">
            Se connecter
        </button>
    </form>

    <div class="mt-8 pt-6 border-t border-gray-100 text-center">
        <p class="text-sm text-gray-600">
            Nouveau sur AfriHealth ? 
            <a href="{% url 'register_page' %}" class="text-blue-600 font-bold hover:underline ml-1">Créer un compte</a>
        </p>
    </div>
</div>
{% endblock %}
