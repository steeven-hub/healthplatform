<div class="container mt-4">
  <div class="card">
    <div class="card-header bg-primary text-white">
      Chat AfriHealth - Session #{{sessionId}}
    </div>
    
    <div class="card-body" style="height: 300px; overflow-y: auto; background: #f8f9fa;">
      <div *ngFor="let m of messages" 
           [ngClass]="{'text-end': m.sender_id === myId, 'text-start': m.sender_id !== myId}" 
           class="mb-2">
        <span [ngClass]="m.sender_id === myId ? 'bg-info text-white' : 'bg-secondary text-white'" 
              class="badge p-2 rounded-pill">
          {{ m.message }}
        </span>
      </div>
    </div>

    <div class="card-footer">
      <div class="input-group">
        <input type="text" class="form-control" [(ngModel)]="newMessage" (keyup.enter)="envoyer()" placeholder="Écrire un message...">
        <button class="btn btn-primary" (click)="envoyer()">Envoyer</button>
      </div>
    </div>
  </div>
</div>
